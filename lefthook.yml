# Install once per clone with `make setup`.

pre-commit:
  commands:
    check:
      run: make check

commit-msg:
  commands:
    attribution:
      run: scripts/check-attribution.sh --hook {1}
    no-em-dash:
      run: scripts/check-no-em-dash.sh {1}
    commitlint:
      run: make commitlint-message FILE={1}

pre-push:
  commands:
    protect-main-and-authorship:
      run: scripts/pre-push.sh
      use_stdin: true
