# Sklyvan is the only author and committer, and no commit carries AI attribution.
# Runs on every branch push as well, so a bad commit is caught before a pull request exists.
name: Authorship

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorship:
    name: authorship
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check authors, committers and attribution lines
        run: make authorship BASE=origin/main
