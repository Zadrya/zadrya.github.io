# SPDX-License-Identifier: GPL-3.0-or-later
name: Licenses

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Runs on main are never cancelled, so every merged commit keeps its result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  licenses:
    name: licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools
        run: pipx install reuse==6.3.0
      - name: Check license information of every file
        run: make licenses
      - name: Reject dependencies with a GPL-3.0-incompatible license
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          allow-licenses: >-
            0BSD, Apache-2.0, BSD-2-Clause, BSD-3-Clause, BSL-1.0, CC0-1.0,
            CC-BY-4.0, CC-BY-SA-4.0, GPL-3.0-only, GPL-3.0-or-later, ISC,
            LGPL-2.1-or-later, LGPL-3.0-only, LGPL-3.0-or-later, MIT, MPL-2.0,
            OFL-1.1, PSF-2.0, Python-2.0, Unicode-3.0, Unlicense, Zlib
